kind = "web"
previewPath = "/"
title = "samsung"
description = "Samsung member account and gadget catalog in UGX, operated by an independent retailer."
version = "1.0.0"
id = "artifacts/gadget-shop-signup"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22717

[services.development]
run = "pnpm --filter @workspace/gadget-shop-signup run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gadget-shop-signup", "run", "build" ]
serve = "static"
publicDir = "artifacts/gadget-shop-signup/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22717"
BASE_PATH = "/"
