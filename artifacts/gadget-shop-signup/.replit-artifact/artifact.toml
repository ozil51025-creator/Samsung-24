kind = "web"
previewPath = "/"
title = "Rewards Program Portal"
description = "A Uganda-focused sales rewards portal with account pages and product price tiers in UGX. Checkout, purchase history, referral tracking, and the requested UGX 5,000 cash bonus are not active."
version = "1.0.0"
id = "artifacts/gadget-shop-signup"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22717

[services.development]
run = "pnpm --filter @workspace/gadget-shop-signup run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gadget-shop-signup", "run", "build" ]
serve = "static"
publicDir = "artifacts/gadget-shop-signup/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22717"
BASE_PATH = "/"
