        priceUgx: { type: integer }
        status: { type: string, enum: [pending_fulfillment] }
        createdAt: { type: string, format: date-time }
    ProductOrdersResponse:
      type: object
      additionalProperties: false
      required: [orders]
      properties:
        orders:
          type: array
          items: { $ref: "#/components/schemas/ProductOrder" }
    WithdrawalRecord:
      type: object
