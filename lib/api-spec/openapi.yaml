        paidWithdrawalsUgx: { type: integer, minimum: 0 }
        pendingWithdrawalsCount: { type: integer, minimum: 0 }
        pendingWithdrawalsUgx: { type: integer, minimum: 0 }
        referralCommissionsUgx: { type: integer, minimum: 0 }
