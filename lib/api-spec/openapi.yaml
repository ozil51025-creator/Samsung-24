openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Phone number and password account operations
  - name: admin
    description: Server-authorized administration operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/register:
    post:
      operationId: registerPhoneAccount
      tags: [auth]
      summary: Register a Ugandan phone-number account
      requestBody:
        required: true
        content:
          application/json:
            schema:
                $ref: "#/components/schemas/RegisterPhoneAccountInput"
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneAccountResponse"
        "400":
          description: Invalid registration details or referral code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Account could not be created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many registration attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/login:
    post:
      operationId: loginPhoneAccount
      tags: [auth]
      summary: Sign in with a Ugandan phone number and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhonePasswordInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneAccountResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Phone number or password is incorrect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many sign-in attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logoutPhoneAccount
      tags: [auth]
      summary: Sign out and revoke the current session
      responses:
        "204":
          description: Session revoked
        "403":
          description: Request origin was not accepted
  /auth/me:
    get:
      operationId: getCurrentPhoneAccount
      tags: [auth]
      summary: Get the current signed-in account
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneAccountResponse"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: Get live administrative totals
      responses:
        "200":
          description: Counts derived from existing account and referral records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Account is not an administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Admin account is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/members:
    get:
      operationId: getAdminMembers
      tags: [admin]
      summary: List member accounts for administrators
      responses:
        "200":
          description: Most recent member accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMembers"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Account is not an administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Admin account is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/members/{memberId}/password-reset:
    post:
      operationId: resetAdminMemberPassword
      tags: [admin]
      summary: Set a one-time temporary password for a member
      parameters:
        - { name: memberId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Temporary password (shown once)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPasswordReset"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Account is not an administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/members/{memberId}/status:
    patch:
      operationId: updateAdminMemberStatus
      tags: [admin]
      summary: Activate or deactivate a member account
      parameters:
        - { name: memberId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminMemberStatusInput"
      responses:
        "200":
          description: Updated member status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMemberStatus"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Account is not an administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/members/{memberId}/wallet-adjustments:
    post:
      operationId: createAdminWalletAdjustment
      tags: [admin]
      summary: Make a reasoned credit or debit to a member wallet
      parameters:
        - { name: memberId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminWalletAdjustmentInput"
      responses:
        "200":
          description: Updated wallet balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminWalletAdjustment"
        "400":
          description: Invalid amount or reason
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Account is not an administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/audit-logs:
    get:
      operationId: getAdminAuditLogs
      tags: [admin]
      summary: Review recent administrator actions
      responses:
        "200":
          description: Recent audited actions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuditLogs"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Account is not an administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/admins:
    get:
      operationId: getAdminAccounts
      tags: [admin]
      summary: List additional administrator accounts
      responses:
        "200":
          description: Administrator accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccounts"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Account is not an administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: addAdminAccount
      tags: [admin]
      summary: Grant administrator access to an existing account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminAccountInput"
      responses:
        "201":
          description: Administrator access granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccount"
        "400":
          description: Invalid phone number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The phone number does not belong to an existing member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Account is already an administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Account is not an administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /task-center:
    get:
      operationId: getTaskCenterSettings
      tags: [task-center]
      summary: Get public task definitions
      responses:
        "200":
          description: Current task definitions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskCenterSettings"
  /team-deposit-milestones:
    get:
      operationId: getTeamDepositMilestones
      tags: [task-center]
      summary: Get direct-referral deposit milestone progress
      responses:
        "200":
          description: Direct team deposit totals and rewards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamDepositMilestones"
  /admin/task-center:
    get:
      operationId: getAdminTaskCenterSettings
      tags: [admin]
      summary: Get task definitions for administrators
      responses:
        "200":
          description: Current task definitions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskCenterSettings"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Account is not an administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Admin account is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateAdminTaskCenterSettings
      tags: [admin]
      summary: Save editable task definitions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCenterSettingsInput"
      responses:
        "200":
          description: Saved task definitions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskCenterSettings"
        "400":
          description: Invalid task definitions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Account is not an administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Admin account is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PhonePasswordInput:
      type: object
      additionalProperties: false
      required: [phoneNumber, password]
      properties:
        phoneNumber:
          type: string
          minLength: 8
          maxLength: 32
          description: Ugandan mobile number in local or international format
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: Account password; never returned by the API
    RegisterPhoneAccountInput:
      type: object
      additionalProperties: false
      required: [phoneNumber, password]
      properties:
        phoneNumber:
          type: string
          minLength: 8
          maxLength: 32
          description: Ugandan mobile number in local or international format
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: Account password; never returned by the API
        referralCode:
          type: string
          minLength: 10
          maxLength: 10
          pattern: "^[A-Z2-9]{10}$"
          description: Optional referral code from the signup link
    PhoneAccount:
      type: object
      additionalProperties: false
      required: [id, phoneNumber, createdAt, referralCode, walletBalanceUgx, totalAccumulatedUgx]
      properties:
        id:
          type: string
          format: uuid
        phoneNumber:
          type: string
          pattern: "^\\+2567[0-9]{8}$"
        createdAt:
          type: string
          format: date-time
        referralCode:
          type: string
          minLength: 10
          maxLength: 10
          pattern: "^[A-Z2-9]{10}$"
          description: Unique, persistent referral code for this account
        walletBalanceUgx:
          type: integer
          minimum: 0
          description: Current wallet balance in UGX
        totalAccumulatedUgx:
          type: integer
          minimum: 0
          description: Total accumulated rewards in UGX
    PhoneAccountResponse:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/PhoneAccount"
    AdminOverview:
      type: object
      additionalProperties: false
      required: [totalUsers, referredUsers, financialRecordsAvailable]
      properties:
        totalUsers:
          type: integer
          minimum: 0
        referredUsers:
          type: integer
          minimum: 0
        financialRecordsAvailable:
          type: boolean
          description: False until a verified payment provider and ledger exist
    AdminMember:
      type: object
      additionalProperties: false
      required: [id, phoneNumber, createdAt, referralCode, referredByAccountId, isActive]
      properties:
        id:
          type: string
          format: uuid
        phoneNumber:
          type: string
          pattern: "^\\+2567[0-9]{8}$"
        createdAt:
          type: string
          format: date-time
        referralCode:
          type: ["string", "null"]
        referredByAccountId:
          type: ["string", "null"]
        isActive: { type: boolean }
    AdminMembers:
      type: object
      additionalProperties: false
      required: [members]
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/AdminMember"
    AdminAccount:
      type: object
      additionalProperties: false
      required: [id, phoneNumber, createdAt]
      properties:
        id: { type: string, format: uuid }
        phoneNumber: { type: string, pattern: "^\\+2567[0-9]{8}$" }
        createdAt: { type: string, format: date-time }
    AdminAccounts:
      type: object
      additionalProperties: false
      required: [admins]
      properties:
        admins:
          type: array
          items:
            $ref: "#/components/schemas/AdminAccount"
    AdminAccountInput:
      type: object
      additionalProperties: false
      required: [phoneNumber]
      properties:
        phoneNumber: { type: string, minLength: 9, maxLength: 16 }
    AdminPasswordReset:
      type: object
      additionalProperties: false
      required: [memberId, temporaryPassword]
      properties:
        memberId: { type: string, format: uuid }
        temporaryPassword: { type: string, minLength: 20, maxLength: 40 }
    AdminMemberStatusInput:
      type: object
      additionalProperties: false
      required: [isActive, reason]
      properties:
        isActive: { type: boolean }
        reason: { type: string, minLength: 3, maxLength: 500 }
    AdminMemberStatus:
      type: object
      additionalProperties: false
      required: [memberId, isActive]
      properties:
        memberId: { type: string, format: uuid }
        isActive: { type: boolean }
    AdminWalletAdjustmentInput:
      type: object
      additionalProperties: false
      required: [direction, amountUgx, reason]
      properties:
        direction: { type: string, enum: [credit, debit] }
        amountUgx: { type: integer, minimum: 1, maximum: 100000000 }
        reason: { type: string, minLength: 3, maxLength: 500 }
    AdminWalletAdjustment:
      type: object
      additionalProperties: false
      required: [memberId, walletBalanceUgx]
      properties:
        memberId: { type: string, format: uuid }
        walletBalanceUgx: { type: integer, minimum: 0 }
    AdminAuditLog:
      type: object
      additionalProperties: false
      required: [id, action, performedByPhone, targetPhone, amountUgx, reason, details, createdAt]
      properties:
        id: { type: integer }
        action: { type: string }
        performedByPhone: { type: string }
        targetPhone: { type: ["string", "null"] }
        amountUgx: { type: ["integer", "null"] }
        reason: { type: ["string", "null"] }
        details: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    AdminAuditLogs:
      type: object
      additionalProperties: false
      required: [logs]
      properties:
        logs:
          type: array
          items:
            $ref: "#/components/schemas/AdminAuditLog"
    TaskCenterTask:
      type: object
      additionalProperties: false
      required: [id, title, objective, objectiveUnit, rewardUgx, rewardFrequency, enabled]
      properties:
        id: { type: string, minLength: 1, maxLength: 64 }
        title: { type: string, minLength: 1, maxLength: 160 }
        objective: { type: integer, minimum: 1, maximum: 1000000000 }
        objectiveUnit: { type: string, minLength: 1, maxLength: 40 }
        rewardUgx: { type: ["integer", "null"], minimum: 0, maximum: 1000000000 }
        rewardFrequency: { type: string, enum: [once, daily] }
        enabled: { type: boolean }
    TaskCenterSettings:
      type: object
      additionalProperties: false
      required: [tasks]
      properties:
        tasks:
          type: array
          maxItems: 30
          items:
            $ref: "#/components/schemas/TaskCenterTask"
    TeamDepositMilestone:
      type: object
      additionalProperties: false
      required: [id, thresholdUgx, rewardUgx, received]
      properties:
        id: { type: string }
        thresholdUgx: { type: integer, minimum: 1 }
        rewardUgx: { type: integer, minimum: 0 }
        received: { type: boolean }
    TeamDepositMilestones:
      type: object
      additionalProperties: false
      required: [teamDepositsUgx, totalRewardsUgx, milestones]
      properties:
        teamDepositsUgx: { type: integer, minimum: 0 }
        totalRewardsUgx: { type: integer, minimum: 0 }
        milestones:
          type: array
          items:
            $ref: "#/components/schemas/TeamDepositMilestone"
    TaskCenterSettingsInput:
      type: object
      additionalProperties: false
      required: [tasks]
      properties:
        tasks:
          type: array
          maxItems: 30
          items:
            $ref: "#/components/schemas/TaskCenterTask"
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string

