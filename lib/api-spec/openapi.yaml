    PayoutAccountInput:
      type: object
      additionalProperties: false
      required: [provider, holderName, phoneNumber]
      properties:
        provider: { type: string, enum: [airtel, mtn] }
        holderName: { type: string, minLength: 2, maxLength: 100 }
        phoneNumber: { type: string, minLength: 9, maxLength: 18 }
    AdminProcessWithdrawalInput:
      type: object
      additionalProperties: false
